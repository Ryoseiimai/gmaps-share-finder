name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check poller scripts
      - name: Python syntax check
        run: python -m py_compile poller/poll.py scripts/get_cookies.py scripts/screenshot_phone.py scripts/dev_mock_feed.py

  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: node --check src/index.js && node --check src/geo.js
      - name: Unit tests (distance / bearing)
        run: npm test
